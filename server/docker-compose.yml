# docker compose up -d
# Set DOMAIN to a hostname whose A/AAAA record points at this machine. Caddy obtains the TLS cert automatically.
services:
  party:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN}
    expose: ["8080"]

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [party]

volumes:
  caddy_data:
