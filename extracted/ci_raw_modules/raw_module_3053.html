<!-- webpack raw module 3053 -->
<style tpInjected>
    #tp-banner {
        position: fixed;
        top: 50px;
        right: 10px;
        width: 25%;
        height: 17.5%;
        z-index: 21474836478 !important;
        border-radius: 4px;
        /* background-color: #171717; */
        transition: transform 1s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* border: 1px solid #323232; */

        filter: opacity(0.94);
        animation: slideIn 0.3s ease-out forwards;
    }

    #tp-banner.slide-out {
        animation: slideOut 0.3s ease-out forwards;
    }

    @keyframes slideIn {
        from {
            transform: translateX(100%);
        }
        to {
            transform: translateX(0);
        }
    }
    @keyframes slideOut {
        from {
            transform: translateX(0);
        }
        to {
            transform: translateX(150%);
        }
    }

    #banner-img {
        position: absolute;
        width: 100%;
        height: auto;
        top: 12px;
        box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
    }

    #exit-icon {
        width: 22px;
        height: auto;
        top: 17px;
        right: 5px;
        position: absolute;
        cursor: pointer;
        z-index: 999;
    }

    #tp-banner {
        cursor: pointer;
    }
</style>
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Teleparty</title>
        <meta charset="UTF-8" />
        <script type="text/javascript" src="../lib/tp_libraries_min.js"></script>
    </head>
    <body>
        <div id="tp-banner">
            <img src="{EXIT_ICON}" id="exit-icon" alt="Exit Image" />
            <img src="{BANNER_LOGO}" id="banner-img" alt="Banner" />
        </div>
    </body>
</html>
