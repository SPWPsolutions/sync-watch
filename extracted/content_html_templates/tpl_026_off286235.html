            <div style="display:flex; flex-direction:column; width:520px; padding:30px 34px;">
                <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
                    <span style="font-size:24px; line-height:1; font-weight:700; color:#ffffff;">Edit Profile Picture</span>
                    ${Za(this.ID_CLOSE,"cursor: pointer !important; opacity:0.72;")}
                </div>

                <div style="display:flex; justify-content:center; margin-top:26px;">
                    <div style="width:112px; height:112px; border-radius:50%; overflow:hidden; background:#8b92a3;">
                        <img id="${this.ID_PREVIEW}" src="${t}" alt="Selected avatar" style="width:100%; height:100%; object-fit:cover; display:block;" />
                    </div>
                </div>

                <span style="margin-top:28px; color:#b9b9c2; font-size:17px; font-weight:400;">Choose an avatar</span>

                <div style="display:flex; align-items:center; gap:12px; margin-top:18px; width:100%;">
                    <button id="${this.ID_PREV_PAGE}" type="button" aria-label="Previous avatars" style="
                        width:34px; height:76px; border-radius:10px; border:1px solid #4f515c;
                        background:#151515; color:#ffffff; font-size:22px; cursor:pointer;
                    ">&lsaquo;</button>

                    <div style="flex:1; overflow:hidden;">
                        <div id="${this.ID_AVATAR_GRID}" style="
                            display:grid; grid-template-columns:repeat(5, 64px); justify-content:space-between; row-gap:14px;
                            transition: opacity 160ms ease, transform 160ms ease;
                            opacity:1; transform:translateX(0);
                        ">
                        ${this.getAvatarGridHtml()}
                        </div>
                    </div>

                    <button id="${this.ID_NEXT_PAGE}" type="button" aria-label="Next avatars" style="
                        width:34px; height:76px; border-radius:10px; border:1px solid #4f515c;
                        background:#151515; color:#ffffff; font-size:22px; cursor:pointer;
                    ">&rsaquo;</button>
                </div>
                <span id="${this.ID_PAGE_LABEL}" style="align-self:center; margin-top:10px; color:#8f9099; font-size:13px; font-weight:500;">
                    ${this.getPageLabel()}
                </span>

                <button id="${this.ID_UPLOAD}" type="button" style="
                    margin-top:24px; width:100%; height:54px; border-radius:14px;
                    border:2px solid #5e606b; background:transparent; color:#ffffff;
                    display:flex; align-items:center; justify-content:center; gap:14px;
                    font-size:18px; font-weight:700; cursor:pointer;
                ">
                    <span aria-hidden="true" style="font-size:18px;">&#x2B06;&#xFE0F;</span>
                    <span>Upload your own picture</span>
                </button>
                <input id="${this.ID_UPLOAD_INPUT}" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;" />

                <span id="${this.ID_ERROR}" class="allchat-error-text" style="display:none; margin-top:12px;"></span>

                <button id="${this.ID_SAVE}" class="gradient-200-button" type="button" style="
                    margin-top:22px; width:100%; height:56px; border-radius:14px;
                    border:none; color:#ffffff; font-size:18px; font-weight:700; cursor:pointer;
                ">Save</button>

                <button id="${this.ID_CANCEL}" type="button" style="
                    align-self:center; margin-top:18px; border:none; background:transparent;
                    color:#b9b9c2; font-size:16px; font-weight:600; cursor:pointer;
                ">Cancel</button>
            </div>
