<style tpInjected>
    /* Critical hide rules inline so icons never flash before overlay.css loads.
     * ID+class beats #tp-buttons-container { display: flex !important }. */
    #tpIconContainer.tp-hidden,
    #tp-buttons-container.tp-hidden,
    #tp-error-box.tp-hidden,
    .tp-hidden {
        display: none !important;
    }
    #tp-buttons-container {
        position: fixed;
        right: 30px;
        top: 50px;
        z-index: 9999;
        width: 50px;
        flex-direction: column;
        align-items: center;
        border-radius: 4px;
        background-color: rgba(0, 0, 0, 0.5);
    }
</style>

        <div class="tp-seperator"></div>
